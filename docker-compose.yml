version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: acousticspace-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./ml:/app/ml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: acousticspace-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: acousticspace-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped