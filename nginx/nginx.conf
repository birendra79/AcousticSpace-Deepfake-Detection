events {}

http {
    server {
        listen 80;

        # Static frontend (built React app, served by the frontend container's
        # own nginx on port 80 — see frontend/Dockerfile production stage)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }

        # Backend API — /api/xyz on the outside maps to /xyz on the backend
        location /api/ {
            proxy_pass http://backend:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Analysis requests can take a while (model inference) —
            # give them more headroom than nginx's 60s default.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}